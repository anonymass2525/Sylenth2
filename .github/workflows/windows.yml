name: Windows x64 VST3 + Crystal Depth 0.5
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64 -DSYLENTH2_BUILD_PLUGIN=ON
      - name: Build Release
        run: cmake --build build --config Release --parallel 4
      - name: DSP tests (assertions enabled even in Release)
        run: ctest --test-dir build -C Release --output-on-failure
      - name: Render 8 Original presets
        shell: pwsh
        run: .\build\Release\sylenth2_render.exe .\demos
      - name: Render all seven modes including Crystal Depth
        shell: pwsh
        run: .\build\Release\sylenth2_render.exe .\demos-beauty --compare
      - name: Render v0.4 5-way transparent-body studies
        shell: pwsh
        run: .\build\Release\sylenth2_render.exe .\demos-study --study
      - name: Render v0.5 independent-axes ablation studies
        shell: pwsh
        run: .\build\Release\sylenth2_render.exe .\demos-depth --depth-study
      - name: Render chord overlap research (clusters, octaves and triads)
        shell: pwsh
        run: .\build\Release\sylenth2_render.exe .\demos-chords --depth-chords
      - name: Package VST3
        shell: pwsh
        run: |
          $bundle = Get-ChildItem -Path build -Filter "*.vst3" -Directory -Recurse | Select-Object -First 1
          if (-not $bundle) { throw "No VST3 bundle found" }
          New-Item -ItemType Directory -Force -Path package | Out-Null
          Copy-Item -Path $bundle.FullName -Destination package -Recurse
      - name: Stage installer payload
        shell: pwsh
        run: |
          $bundle = Get-ChildItem -Path build -Filter "*.vst3" -Directory -Recurse | Select-Object -First 1
          if (-not $bundle) { throw "VST3 bundle missing" }
          if ($bundle.Name -ne "Crystal typeGPT.vst3") { throw "Unexpected VST3 bundle name: $($bundle.Name)" }
          New-Item -ItemType Directory -Force -Path installer-payload | Out-Null
          Copy-Item -Path $bundle.FullName -Destination installer-payload -Recurse -Force
      - name: Install Inno Setup compiler
        shell: pwsh
        run: |
          $compiler = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $compiler)) { choco install innosetup --yes --no-progress }
          if (-not (Test-Path $compiler)) { throw "ISCC.exe not found" }
      - name: Build Windows Setup EXE
        shell: pwsh
        run: |
          $compiler = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          $match = Select-String -Path CMakeLists.txt -Pattern '^project\(Crystal VERSION ([0-9]+\.[0-9]+\.[0-9]+)'
          if (-not $match) { throw "Could not extract version from CMake" }
          $version = $match.Matches[0].Groups[1].Value
          & $compiler "/DMyAppVersion=$version" "installer/Crystal.iss"
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup compilation failed: $LASTEXITCODE" }
          if (-not (Test-Path installer-output)) { throw "Installer output folder missing" }
          $setup = Get-ChildItem installer-output -Filter '*-Setup.exe' | Select-Object -First 1
          if (-not $setup) { throw "Installer EXE not created" }
          Write-Host "Created: $($setup.Name)"
      - name: Upload Windows installer, VST3 and all WAV demos
        uses: actions/upload-artifact@v4
        with:
          name: Crystal-typeGPT-v0.5.0-Windows-x64-Setup-and-Studies
          path: |
            installer-output/*.exe
            package/**
            demos/*.wav
            demos-beauty/*.wav
            demos-study/*.wav
            demos-depth/*.wav
            demos-chords/*.wav
          retention-days: 90
